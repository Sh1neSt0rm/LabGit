name: TruffleHog Secret Scan

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  secret-scan:
    name: TruffleHog
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown,unverified